<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이미지 세로 뷰어</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#151719;color:#eceeef;--width:800px}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{border:1px solid #41474d;background:#292e33;color:inherit;border-radius:8px;padding:9px 13px;cursor:pointer;white-space:nowrap}button:hover:not(:disabled){background:#3b434a}button:disabled{opacity:.35;cursor:default}button.primary{background:#b9e49a;color:#17230f;border-color:transparent;font-weight:700}button:focus-visible,input:focus-visible,[role=separator]:focus-visible{outline:3px solid #b9e49a;outline-offset:3px}
header{position:sticky;top:0;z-index:5;background:#1d2125f5;border-bottom:1px solid #343a40;padding:15px 24px;backdrop-filter:blur(12px)}.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:18px;font-weight:750;margin-right:12px}.brand span{color:#b9e49a}.actions{display:flex;gap:8px;flex-wrap:wrap}.meta{margin-left:auto;color:#a8b0b7;font-size:13px;display:flex;gap:12px;align-items:center}.width-value{color:#edf2e9;width:84px;padding:6px 8px;background:#14181b;border:1px solid #485047;border-radius:6px}.hint{color:#929ca4;font-size:12px;margin:10px 0 0;line-height:1.6}
main{padding:24px 32px 70px;min-height:calc(100vh - 110px)}#empty{max-width:680px;margin:11vh auto 0;text-align:center;border:1px dashed #4b565e;border-radius:20px;padding:65px 25px;background:#1b2023}.icon{font-size:42px;color:#b9e49a;margin-bottom:18px}h1{font-size:25px;margin:0 0 14px}#empty p{color:#9da7af;line-height:1.8;font-size:14px;margin:0 0 24px}.tags{margin-top:22px;font-size:12px;color:#77828b}
#viewer{position:relative;width:var(--width);max-width:100%;margin:0 auto}#images{width:100%;background:#202427}figure{margin:0;width:100%;position:relative}figure img{display:block;width:100%;height:auto}figure.failed{padding:32px 14px;background:#372c2b;color:#f5c0b7;font-size:14px;overflow-wrap:anywhere}#handle{position:absolute;right:-5px;top:0;bottom:0;width:10px;cursor:ew-resize;touch-action:none;user-select:none;background:transparent}body.resizing,body.resizing *{cursor:ew-resize!important;user-select:none!important}#dropOverlay{position:fixed;inset:12px;z-index:20;pointer-events:none;border:3px dashed #b9e49a;border-radius:20px;background:#162018e8;display:grid;place-content:center;text-align:center;font-size:26px;font-weight:700;color:#d9f4c9}#dropOverlay small{font-size:14px;font-weight:400;margin-top:12px;color:#b5c7ac}#notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:min(90vw,700px);padding:12px 18px;background:#e5ebdf;color:#1d271b;border-radius:10px;z-index:30;font-size:14px;box-shadow:0 5px 25px #0006;white-space:pre-line;overflow-wrap:anywhere}[hidden]{display:none!important}
@media(max-width:650px){header{padding:12px 16px}main{padding:18px 12px 60px}.brand{width:100%}.meta{margin-left:0}button{padding:8px 10px;font-size:13px}#empty{margin-top:6vh;padding:40px 18px}h1{font-size:21px}}
</style>
</head>
<body>
<header>
 <div class="top"><div class="brand"><span>▥</span> 이미지 세로 뷰어</div>
 <div class="actions"><button class="primary" id="add">＋ 이미지 추가</button><button id="addFolder">＋ 폴더 추가</button><button id="shuffle" disabled>⇄ 전체 섞기</button><button id="shuffleFolders" disabled>⇄ 폴더 안에서 섞기</button><button id="restore" disabled>↶ 처음 순서로</button><button id="clear" disabled>전체 비우기</button></div>
 <div class="meta"><span id="count" aria-live="polite">0장</span><label>가로폭 <input class="width-value" id="widthInput" type="number" min="1" step="10" value="800" aria-label="전체 이미지 가로폭"> px</label></div></div>
 <p class="hint">이미지나 폴더를 창 안으로 드래그하세요 · 하위 폴더도 각각 구분해 불러옵니다 · 이미지 오른쪽 끝을 잡고 움직이면 전체 이미지 폭이 바뀝니다.</p>
</header>
<main id="main">
 <section id="empty"><div class="icon" aria-hidden="true">▧ ↓</div><h1>이미지를 쭉, 한눈에.</h1><p>이미지나 폴더를 여기에 끌어다 놓으세요.<br>같은 가로폭으로 맞춰 위에서 아래로 이어 보여줍니다.</p><button class="primary" id="emptyAdd">이미지 선택하기</button> <button id="emptyFolderAdd">폴더 선택하기</button><div class="tags">JPG · PNG · WebP · GIF · AVIF · BMP<br>기기 안에서 처리 · 원본 파일 유지</div></section>
 <section id="viewer" hidden aria-label="이미지 목록"><div id="images"></div><div id="handle" role="separator" tabindex="0" aria-orientation="vertical" aria-label="전체 이미지 가로폭 조절. 좌우 방향키로도 조절할 수 있습니다." title="좌우로 드래그하여 폭 조절"></div></section>
</main>
<div id="dropOverlay" hidden>이미지나 폴더를 놓아 추가하세요<small>현재 목록의 맨 뒤에 이어집니다</small></div>
<div id="notice" role="status" hidden></div>
<input id="fileInput" type="file" accept="image/*" multiple hidden>
<input id="folderInput" type="file" webkitdirectory multiple hidden>
<script>
'use strict';
const $=id=>document.getElementById(id);
const main=$('main'),viewer=$('viewer'),images=$('images'),handle=$('handle'),widthInput=$('widthInput');
let nextFolderId=0,importEpoch=0,importQueue=Promise.resolve();
let items=[],nextId=0,desiredWidth=800,displayWidth=800,dragDepth=0,resizeState=null,noticeTimer;
function notify(message){$('notice').textContent=message;$('notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('notice').hidden=true,6000)}
function maxWidth(){return Math.max(1,Math.floor(main.clientWidth-parseFloat(getComputedStyle(main).paddingLeft)-parseFloat(getComputedStyle(main).paddingRight)))}
function applyWidth(value,preserve=true){
 const max=maxWidth(),min=Math.min(200,max);desiredWidth=Math.max(min,Math.min(max,Number(value)||min));
 let anchor=null,offset=0;
 if(preserve&&items.length){const line=document.querySelector('header').getBoundingClientRect().bottom;anchor=items.find(x=>x.node.getBoundingClientRect().bottom>line);if(anchor){const r=anchor.node.getBoundingClientRect();if(r.top<=line)offset=(line-r.top)/Math.max(1,r.height);else anchor=null}}
 displayWidth=desiredWidth;viewer.style.setProperty('--width',displayWidth+'px');widthInput.value=displayWidth;widthInput.min=min;widthInput.max=max;handle.setAttribute('aria-valuemin',min);handle.setAttribute('aria-valuemax',max);handle.setAttribute('aria-valuenow',displayWidth);
 if(anchor){const line=document.querySelector('header').getBoundingClientRect().bottom,r=anchor.node.getBoundingClientRect();window.scrollBy(0,r.top+offset*r.height-line)}
}
function sync(){const n=items.length,groups=new Map();for(const item of items){if(item.folderId!==null)groups.set(item.folderId,(groups.get(item.folderId)||0)+1)}$('empty').hidden=n>0;viewer.hidden=n===0;$('count').textContent=n+'장'+(groups.size?' · '+groups.size+'폴더':'');$('shuffle').disabled=n<2;$('shuffleFolders').disabled=![...groups.values()].some(n=>n>1);$('restore').disabled=n<2;$('clear').disabled=n===0}
function render(){const f=document.createDocumentFragment();items.forEach(x=>f.append(x.node));images.append(f);sync()}
function topOfList(){window.scrollTo({top:0,behavior:'instant'})}
function addFiles(files,folderId=null){
 const accepted=[],skipped=[];for(const file of files){if(file.type.startsWith('image/')||/\.(jpe?g|png|webp|gif|avif|bmp|svg)$/i.test(file.name))accepted.push(file);else skipped.push(file.name)}
 if(skipped.length)notify('이미지가 아닌 파일은 제외했어요: '+skipped.slice(0,4).join(', ')+(skipped.length>4?' 외 '+(skipped.length-4)+'개':''));
 if(!accepted.length)return;
 for(const file of accepted){
  const url=URL.createObjectURL(file),node=document.createElement('figure'),img=document.createElement('img');
  const item={id:nextId++,url,node,folderId};img.alt=file.name;img.title=file.name;img.decoding='async';img.loading='lazy';node.append(img);items.push(item);images.append(node);
  img.addEventListener('error',()=>{node.classList.add('failed');node.textContent='이미지를 열 수 없습니다: '+file.name;URL.revokeObjectURL(url)},{once:true});
  img.src=url;
  // Read dimensions separately so lazy images reserve their full scrolling space.
  const probe=new Image();probe.onload=()=>{if(node.isConnected){img.width=probe.naturalWidth;img.height=probe.naturalHeight}probe.onload=null;probe.onerror=null};probe.onerror=()=>{probe.onload=null;probe.onerror=null};probe.src=url;
 }
 sync();applyWidth(desiredWidth,false);
}
$('add').onclick=$('emptyAdd').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{const files=Array.from(e.target.files);enqueueImport(()=>addFiles(files));e.target.value=''};
function enqueueImport(task){const epoch=importEpoch;importQueue=importQueue.then(async()=>{if(epoch!==importEpoch)return;await task(()=>epoch===importEpoch)}).catch(()=>notify('일부 파일을 읽지 못했어요. 폴더 접근 권한을 확인해 주세요.'))}
$('addFolder').onclick=$('emptyFolderAdd').onclick=()=>{if(!('webkitdirectory' in $('folderInput'))){notify('이 브라우저는 폴더 선택을 지원하지 않아요. Chrome 또는 Edge에서 열어 주세요.');return}$('folderInput').click()};
$('folderInput').onchange=e=>{
 const entries=Array.from(e.target.files,file=>({file,path:file.webkitRelativePath||file.name}));
 entries.sort((a,b)=>a.path.localeCompare(b.path,'ko',{numeric:true}));
 enqueueImport(()=>addFolderFiles(entries));e.target.value='';
};
// Keep each image's immediate parent folder, including its full ancestry.
function addFolderFiles(entries){
 const groups=new Map();let batch=[],batchFolder=null;
 for(const {file,path} of entries){
  const slash=path.lastIndexOf('/'),folder=slash<0?'':path.slice(0,slash);
  if(!groups.has(folder))groups.set(folder,nextFolderId++);
  const folderId=groups.get(folder);
  if(batch.length&&batchFolder!==folderId){addFiles(batch,batchFolder);batch=[]}
  batchFolder=folderId;batch.push(file);
 }
 if(batch.length)addFiles(batch,batchFolder);
}
function shuffleList(list){if(list.length<2)return;const old=list.map(x=>x.id);do{for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}while(list.every((x,i)=>x.id===old[i]))}
$('shuffleFolders').onclick=()=>{
 const groups=new Map();items.forEach((item,index)=>{if(item.folderId===null)return;if(!groups.has(item.folderId))groups.set(item.folderId,[]);groups.get(item.folderId).push(index)});
 for(const slots of groups.values()){const group=slots.map(i=>items[i]);shuffleList(group);slots.forEach((slot,i)=>items[slot]=group[i])}
 render();topOfList();notify('각 폴더 안의 이미지 순서를 섞었어요');
};
$('shuffle').onclick=()=>{if(items.length<2)return;shuffleList(items);render();topOfList();notify('전체 이미지 순서를 섞었어요')};
$('restore').onclick=()=>{items.sort((a,b)=>a.id-b.id);render();topOfList();notify('처음 추가한 순서로 돌아왔어요')};
$('clear').onclick=()=>{importEpoch++;for(const item of items)URL.revokeObjectURL(item.url);items=[];images.replaceChildren();sync();topOfList();notify('목록을 비웠어요')};
widthInput.onchange=()=>applyWidth(widthInput.value);widthInput.onkeydown=e=>{if(e.key==='Enter'){applyWidth(widthInput.value);widthInput.blur()}};
handle.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();resizeState={x:e.clientX,width:displayWidth};handle.setPointerCapture(e.pointerId);document.body.classList.add('resizing')});
handle.addEventListener('pointermove',e=>{if(resizeState)applyWidth(resizeState.width+2*(e.clientX-resizeState.x))});
function endResize(){resizeState=null;document.body.classList.remove('resizing')}
handle.addEventListener('pointerup',endResize);handle.addEventListener('pointercancel',endResize);handle.addEventListener('lostpointercapture',endResize);
handle.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();applyWidth(displayWidth+(e.key==='ArrowRight'?1:-1)*(e.shiftKey?50:10))}});
const hasFiles=e=>Array.from(e.dataTransfer?.types||[]).includes('Files');
window.addEventListener('dragenter',e=>{if(hasFiles(e)){e.preventDefault();dragDepth++;$('dropOverlay').hidden=false}});
window.addEventListener('dragover',e=>{e.preventDefault();if(hasFiles(e))e.dataTransfer.dropEffect='copy'});
window.addEventListener('dragleave',e=>{if(hasFiles(e)){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('dropOverlay').hidden=true}});
// Directory readers may return children in several batches (often 100 at a time).
async function readDirectory(entry,files,isCurrent,failures,parentPath=''){
 const path=parentPath?parentPath+'/'+entry.name:entry.name;
 if(!isCurrent())return;
 if(entry.isFile){try{const file=await new Promise((resolve,reject)=>entry.file(resolve,reject));files.push({file,path})}catch{failures.count++}return}
 if(!entry.isDirectory)return;
 try{const reader=entry.createReader(),children=[];while(isCurrent()){const batch=await new Promise((resolve,reject)=>reader.readEntries(resolve,reject));if(!batch.length)break;children.push(...batch)}children.sort((a,b)=>a.name.localeCompare(b.name,'ko',{numeric:true}));for(const child of children){if(!isCurrent())return;await readDirectory(child,files,isCurrent,failures,path)}}catch{failures.count++}
}
window.addEventListener('drop',e=>{
 e.preventDefault();dragDepth=0;$('dropOverlay').hidden=true;
 const transfer=e.dataTransfer;if(!transfer)return;
 // Capture entries during the drop event, before the browser clears its data store.
 const sources=Array.from(transfer.items||[]).filter(x=>x.kind==='file').map(x=>({entry:x.webkitGetAsEntry?.(),file:x.getAsFile()}));
 const fallback=Array.from(transfer.files||[]);
 enqueueImport(async isCurrent=>{
  if(!sources.length){addFiles(fallback);return}
  const failures={count:0};
  for(const source of sources){
   if(!isCurrent())return;
   if(source.entry?.isDirectory){notify('폴더의 이미지를 읽고 있어요…');const files=[];await readDirectory(source.entry,files,isCurrent,failures);if(isCurrent()){if(files.length)addFolderFiles(files);else notify('폴더에서 읽을 수 있는 파일을 찾지 못했어요')}}
   else if(source.file)addFiles([source.file]);
  }
  if(isCurrent()&&failures.count)notify(failures.count+'개 파일 또는 하위 폴더를 읽지 못했어요. 나머지는 추가했어요.');
 });
});
window.addEventListener('dragend',()=>{dragDepth=0;$('dropOverlay').hidden=true});
window.addEventListener('resize',()=>applyWidth(desiredWidth));
window.addEventListener('beforeunload',()=>{for(const item of items)URL.revokeObjectURL(item.url)});
applyWidth(desiredWidth,false);sync();
</script>
</body>
</html>
