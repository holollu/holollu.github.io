<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위키 리스트</title>
    <style>
        /* 1. 기본 배경 및 레이아웃 */
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 50px 0; /* 위아래 여백 */
            display: flex;
            flex-direction: column;
            align-items: center; 
            font-family: 'Pretendard', sans-serif;
            box-sizing: border-box;
        }

        /* 2. 박스들이 들어갈 컨테이너 */
        .main-container {
            display: flex;
            flex-direction: column;
            gap: 20px; 
            width: 90%; /* 모바일 등 작은 화면에서 양옆 여백 확보 */
            max-width: 1600px; /* 최대 크기 1600px */
        }

        /* 3. 공통 박스 스타일 */
        .card-link {
            text-decoration: none;
            color: inherit;
            display: block;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%; /* 부모 너비에 맞춤 */
        }

        .box {
            padding: 40px 50px; /* 넓은 화면에 맞춰 패딩을 조금 키움 */
            border-radius: 16px; /* 박스가 커졌으므로 곡률도 살짝 조정 */
            border-left: 12px solid; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            background-color: #ffffff;
            box-sizing: border-box; /* 패딩이 너비에 영향을 주지 않도록 설정 */
        }

        .box:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .title {
            font-size: 1.5rem; /* 화면이 커졌으므로 글자 크기도 약간 키움 */
            font-weight: bold;
            margin: 0;
            word-break: keep-all;
        }

        /* 4. 개별 박스 색상 설정 */
        .box-hall-academy {
            background-color: #f8faff; 
            border-left-color: #1a237e; 
        }
        .box-hall-academy .title {
            color: #1a237e;
        }

        /* 모바일 대응 (화면이 작아질 때 글자 크기 조정) */
        @media (max-width: 600px) {
            .box {
                padding: 25px 30px;
            }
            .title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- 박스 1: 한라 국제 마법 아카데미 -->
        <a href="halla.html" class="card-link">
            <div class="box box-hall-academy">
                <p class="title">한라 국제 마법 아카데미</p>
            </div>
        </a>

        <!-- 여기에 동일한 방식으로 박스를 추가하면 자동으로 1600px까지 늘어납니다 -->

    </div>

</body>
</html>
