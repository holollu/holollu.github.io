<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>에테르의 잔향 RE - 전체 문서 목록</title>
    <style>
        /* 폰트 설정 (Paperozi) */
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-1Thin.woff2') format('woff2');
            font-weight: 100;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-2ExtraLight.woff2') format('woff2');
            font-weight: 200;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2');
            font-weight: 300;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2');
            font-weight: 500;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2');
            font-weight: 700;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');
            font-weight: 800;
            font-display: swap;
        }
        @font-face {
            font-family: 'Paperozi';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');
            font-weight: 900;
            font-display: swap;
        }

        /* 색상 변수 */
        :root {
            --base-color: #ffffff;          /* 메인 카드 배경 */
            --main-color: #f9f8fb;          /* 지정 배경색 (분류 헤더 등) */
            --point-color: #594673;         /* 지정 포인트 색상 */
            --hover-color: #efeaf4;         /* 마우스 오버 시 색상 */
            --bg-grey: #f2eff6;             /* 전체 배경 */
            --border-color: #ded8e6;        /* 테두리 색상 */
            --link-color: #594673;          /* 링크 색상 */
            --text-main: #333333;           /* 본문 텍스트 */
            --text-sub: #666666;            /* 부가 설명 텍스트 */
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Paperozi', sans-serif;
            font-weight: 400;
            background-color: var(--bg-grey);
            color: var(--text-main);
            line-height: 1.6;
        }

        /* 헤더 */
        header {
            background-color: var(--point-color);
            color: white;
            padding: 15px 20px;
            font-weight: 700;
            font-size: 1.2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header a {
            text-decoration: none;
            color: white;
            transition: opacity 0.2s;
        }

        header a:hover {
            opacity: 0.9;
        }

        /* 메인 컨테이너 */
        .container {
            max-width: 1000px;
            margin: 40px auto;
            background-color: var(--base-color);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
            min-height: 80vh;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--point-color);
            padding-bottom: 10px;
            color: var(--point-color);
        }

        /* 분류 아코디언 */
        .category-container {
            border: 1px solid var(--border-color);
            margin-bottom: 15px;
            border-radius: 6px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .category-header {
            background-color: var(--main-color);
            color: var(--point-color);
            padding: 14px 20px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: background 0.2s;
        }

        .category-header:hover {
            background-color: var(--hover-color);
        }

        .category-header::after {
            content: '[ 펼치기 ]';
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.8;
        }

        .category-container.active .category-header::after {
            content: '[ 접기 ]';
        }

        .category-content {
            display: none;
            padding: 20px;
            background-color: #fff;
            border-top: 1px solid var(--border-color);
        }

        .category-container.active .category-content {
            display: block;
        }

        /* 임시 내용 설명글 */
        .category-desc {
            margin: 0 0 15px 0;
            color: var(--text-sub);
            font-size: 0.95rem;
            line-height: 1.5;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
        }

        /* 문서 리스트 */
        .document-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px 20px;
        }

        .document-list li a {
            text-decoration: none;
            color: var(--link-color);
            font-weight: 500;
            font-size: 1rem;
            display: inline-block;
            transition: transform 0.15s ease, color 0.15s ease;
        }

        .document-list li a:hover {
            text-decoration: underline;
            transform: translateX(4px);
        }

        /* 모바일 반응형 */
        @media (max-width: 768px) {
            body {
                background-color: var(--base-color);
            }
            .container {
                margin: 0;
                padding: 20px 15px;
                box-shadow: none;
                border: none;
                border-radius: 0;
            }
            h1 {
                font-size: 1.6rem;
            }
            .document-list {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .document-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <a href="index.html">Wiki Project</a>
</header>

<div class="container">
    <h1>에테르의 잔향 RE - 전체 문서 목록</h1>

    <!-- 분류 1 -->
    <div class="category-container">
        <div class="category-header">임시 제목1</div>
        <div class="category-content">
            <p class="category-desc">임시 내용1</p>
            <ul class="document-list">
                <li><a href="#">임시 문서1</a></li>
                <li><a href="#">임시 문서2</a></li>
                <li><a href="#">임시 문서3</a></li>
            </ul>
        </div>
    </div>

    <!-- 분류 2 -->
    <div class="category-container">
        <div class="category-header">임시 제목2</div>
        <div class="category-content">
            <p class="category-desc">임시 내용2</p>
            <ul class="document-list">
                <li><a href="#">임시 문서1</a></li>
                <li><a href="#">임시 문서2</a></li>
                <li><a href="#">임시 문서3</a></li>
            </ul>
        </div>
    </div>

    <!-- 분류 3 -->
    <div class="category-container">
        <div class="category-header">임시 제목3</div>
        <div class="category-content">
            <p class="category-desc">임시 내용3</p>
            <ul class="document-list">
                <li><a href="#">임시 문서1</a></li>
                <li><a href="#">임시 문서2</a></li>
                <li><a href="#">임시 문서3</a></li>
            </ul>
        </div>
    </div>

</div>

<script>
    // 아코디언 펼치기/접기 스크립트
    document.querySelectorAll('.category-header').forEach(header => {
        header.addEventListener('click', () => {
            const container = header.parentElement;
            container.classList.toggle('active');
        });
    });
</script>

</body>
</html>
